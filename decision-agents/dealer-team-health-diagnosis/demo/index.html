<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>团队健康度 AI 诊断 MVP</title>
  <style>
    :root {
      --bg: #f5f7f8;
      --paper: #fff;
      --ink: #1d2932;
      --muted: #61717d;
      --line: #d9e3e8;
      --soft: #edf3f5;
      --teal: #0f8a83;
      --blue: #2f63c7;
      --green: #16784f;
      --amber: #a36500;
      --red: #b84238;
      --slate: #2c3a43;
      --radius: 8px;
      --shadow: 0 12px 28px rgba(31,46,55,.08);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", Arial, sans-serif;
      letter-spacing: 0;
    }
    button, input, select { font: inherit; }
    button { border: 0; cursor: pointer; }
    h1, h2, h3, p { margin-top: 0; }

    .shell {
      max-width: 1440px;
      margin: 0 auto;
      padding: 18px 22px 36px;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: start;
      margin-bottom: 14px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .mark {
      width: 46px;
      height: 46px;
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--slate), var(--teal));
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 900;
      flex: 0 0 auto;
    }

    h1 { margin-bottom: 5px; font-size: 25px; line-height: 1.18; font-weight: 900; }
    .subtitle { margin: 0; color: var(--muted); max-width: 940px; line-height: 1.5; font-size: 14px; }

    .control-bar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 220px;
      gap: 10px;
      border: 1px solid var(--line);
      background: var(--paper);
      border-radius: var(--radius);
      padding: 12px;
      box-shadow: 0 6px 18px rgba(31,46,55,.04);
      margin-bottom: 14px;
    }

    label { display: block; color: var(--muted); font-size: 12px; font-weight: 900; margin-bottom: 5px; }
    select {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      color: var(--ink);
      padding: 0 10px;
    }

    .workflow {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .step {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      padding: 12px;
      min-height: 100px;
    }
    .step.active {
      border-color: rgba(15,138,131,.52);
      box-shadow: inset 0 0 0 2px rgba(15,138,131,.12), var(--shadow);
    }
    .step small { display: block; color: var(--teal); font-size: 12px; font-weight: 900; margin-bottom: 6px; }
    .step b { display: block; margin-bottom: 5px; font-size: 15px; }
    .step span { display: block; color: var(--muted); font-size: 12px; line-height: 1.38; }

    .decision-shell {
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }
    .side-nav {
      position: sticky;
      top: 14px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      padding: 12px;
      box-shadow: 0 6px 18px rgba(31,46,55,.04);
    }
    .side-nav h2 {
      margin-bottom: 8px;
      font-size: 15px;
    }
    .side-nav p {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }
    .nav-item {
      width: 100%;
      min-height: 74px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      text-align: left;
      padding: 10px;
      margin-bottom: 8px;
    }
    .nav-item.active {
      border-color: rgba(15,138,131,.62);
      background: #f2fbf9;
      box-shadow: inset 0 0 0 2px rgba(15,138,131,.12);
    }
    .nav-item small { display: block; color: var(--teal); font-size: 12px; font-weight: 900; margin-bottom: 4px; }
    .nav-item b { display: block; margin-bottom: 4px; font-size: 14px; }
    .nav-item span { display: block; color: var(--muted); font-size: 12px; line-height: 1.35; }

    .grid-2 {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(360px, .7fr);
      gap: 14px;
      margin-bottom: 14px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .panel {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--paper);
      padding: 15px;
      box-shadow: 0 6px 18px rgba(31,46,55,.04);
      min-width: 0;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
      margin-bottom: 12px;
    }

    h2 { margin-bottom: 6px; font-size: 20px; line-height: 1.24; font-weight: 900; }
    h3 { margin-bottom: 8px; font-size: 15px; line-height: 1.25; font-weight: 900; }
    .note { margin: -2px 0 11px; color: var(--muted); font-size: 13px; line-height: 1.45; }

    .score-hero {
      display: grid;
      grid-template-columns: 178px minmax(0, 1fr);
      gap: 16px;
      align-items: center;
    }

    .score-ring {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: conic-gradient(var(--teal) calc(var(--score) * 1%), #e7eef1 0);
      position: relative;
    }
    .score-ring:before {
      content: "";
      position: absolute;
      width: 118px;
      height: 118px;
      border-radius: 50%;
      background: var(--paper);
    }
    .score-ring strong {
      position: relative;
      font-size: 36px;
      line-height: 1;
      z-index: 1;
    }
    .score-ring span {
      position: relative;
      display: block;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
      z-index: 1;
      margin-top: 5px;
    }

    .badge-row { display: flex; gap: 7px; flex-wrap: wrap; margin: 8px 0 10px; }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 25px;
      padding: 3px 8px;
      border-radius: 999px;
      background: rgba(22,120,79,.12);
      color: #126642;
      font-size: 12px;
      font-weight: 900;
      white-space: nowrap;
    }
    .badge.red { background: rgba(184,66,56,.13); color: #99352d; }
    .badge.yellow { background: rgba(163,101,0,.14); color: #835000; }
    .badge.blue { background: rgba(47,99,199,.12); color: #2853a4; }
    .badge.gray { background: var(--soft); color: var(--muted); }

    .ai-box {
      border-left: 5px solid var(--teal);
      border-radius: var(--radius);
      background: #f2fbf9;
      padding: 12px;
    }
    .ai-box.red { border-left-color: var(--red); background: #fff6f5; }
    .ai-box.yellow { border-left-color: var(--amber); background: #fff9ef; }
    .ai-box b { display: block; margin-bottom: 6px; }
    .ai-box p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.48; }

    .kpi {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fbfcfd;
      padding: 12px;
      min-height: 96px;
    }
    .kpi label { margin-bottom: 8px; }
    .kpi strong { display: block; font-size: 25px; line-height: 1.08; overflow-wrap: anywhere; }
    .kpi span { display: block; margin-top: 7px; color: var(--muted); font-size: 12px; line-height: 1.34; }

    .dimension-list { display: grid; gap: 9px; }
    .dimension {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px;
      background: #fbfcfd;
    }
    .dim-head {
      display: grid;
      grid-template-columns: 132px 1fr 82px;
      gap: 10px;
      align-items: center;
      margin-bottom: 7px;
      font-size: 13px;
    }
    .bar-track {
      height: 10px;
      border-radius: 999px;
      background: var(--soft);
      overflow: hidden;
    }
    .bar-track span { display: block; height: 100%; border-radius: 999px; background: var(--teal); }
    .bar-track span.warn { background: var(--amber); }
    .bar-track span.danger { background: var(--red); }
    .dimension p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.36; }

    .model-grid {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }
    .model-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fbfcfd;
      padding: 10px;
      min-height: 122px;
    }
    .model-card b { display: block; margin-bottom: 6px; font-size: 13px; }
    .model-card strong { display: block; margin-bottom: 6px; color: var(--teal); font-size: 18px; }
    .model-card span { display: block; color: var(--muted); font-size: 12px; line-height: 1.38; }
    .formula {
      border-radius: var(--radius);
      background: #eef7f6;
      color: #174c48;
      padding: 10px 12px;
      font-weight: 900;
      line-height: 1.45;
    }

    .loss-list { display: grid; gap: 8px; }
    .loss-row {
      display: grid;
      grid-template-columns: 120px minmax(0,1fr) 80px;
      gap: 10px;
      align-items: center;
      font-size: 13px;
    }

    .risk-tabs {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }
    .risk-tab {
      min-height: 62px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fff;
      text-align: left;
      padding: 9px;
    }
    .risk-tab.active {
      border-color: rgba(15,138,131,.52);
      box-shadow: inset 0 0 0 2px rgba(15,138,131,.12);
    }
    .risk-tab b { display: block; margin-bottom: 3px; font-size: 13px; }
    .risk-tab span { color: var(--muted); font-size: 12px; }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 9px 8px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; vertical-align: middle; }
    th { background: #f6f9fa; color: var(--muted); font-size: 12px; font-weight: 900; }
    tr:last-child td { border-bottom: 0; }
    .empty-row { padding: 22px 12px; color: var(--muted); text-align: center; white-space: normal; }

    .question-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .question-list li {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fbfcfd;
      padding: 10px;
      color: var(--ink);
      font-size: 13px;
      line-height: 1.45;
    }
    .question-list b { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }

    .team-list { display: grid; gap: 9px; }
    .team-row {
      display: grid;
      grid-template-columns: minmax(170px, 1.2fr) 92px minmax(180px, 1fr) 120px;
      gap: 10px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fbfcfd;
      padding: 10px;
      text-align: left;
      width: 100%;
    }
    .team-row.active {
      border-color: rgba(15,138,131,.62);
      box-shadow: inset 0 0 0 2px rgba(15,138,131,.12);
      background: #f2fbf9;
    }
    .team-row b { display: block; margin-bottom: 3px; font-size: 14px; }
    .team-row span, .team-row small { color: var(--muted); font-size: 12px; line-height: 1.35; }
    .team-row strong { font-size: 24px; line-height: 1; }
    .segment-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
    }
    .segment-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fbfcfd;
      padding: 10px;
      min-height: 98px;
    }
    .segment-card strong { display: block; font-size: 25px; line-height: 1; margin: 5px 0; }
    .segment-card span { color: var(--muted); font-size: 12px; line-height: 1.35; }
    .rank-list,
    .tag-list { display: grid; gap: 8px; }
    .rank-row {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) 70px;
      gap: 10px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #fbfcfd;
      padding: 9px;
      font-size: 13px;
    }
    .rank-row small { color: var(--muted); display: block; margin-top: 3px; }
    .rank-row strong { font-size: 20px; text-align: right; }
    .tag-row {
      display: grid;
      grid-template-columns: 100px 1fr 40px;
      gap: 8px;
      align-items: center;
      font-size: 13px;
    }
    .tag-row .bar-track { height: 12px; }

    .overview-profile {
      margin-bottom: 14px;
    }
    .overview-profile-grid {
      display: grid;
      grid-template-columns: minmax(420px, 1.15fr) minmax(320px, .85fr);
      gap: 20px;
      align-items: start;
    }
    .profile-block + .profile-block {
      border-left: 1px solid var(--line);
      padding-left: 20px;
    }
    .profile-block h3 { margin-bottom: 5px; }
    .profile-block .note { margin-bottom: 12px; }
    .focus-summary {
      margin-bottom: 12px;
    }
    .focus-panel .team-row {
      grid-template-columns: minmax(190px, 1.1fr) 80px minmax(220px, 1fr) 110px;
    }
    .focus-panel .team-row > span:last-child {
      color: var(--blue);
      font-weight: 900;
      text-align: right;
    }

    @media (max-width: 1100px) {
      .grid-2, .decision-shell { grid-template-columns: 1fr; }
      .grid-3, .workflow, .risk-tabs, .model-grid, .segment-grid { grid-template-columns: 1fr 1fr; }
      .control-bar { grid-template-columns: 1fr 1fr; }
      .side-nav { position: static; }
      .team-row { grid-template-columns: 1fr 90px; }
      .overview-profile-grid { grid-template-columns: 1fr; }
      .profile-block + .profile-block {
        border-left: 0;
        border-top: 1px solid var(--line);
        padding: 16px 0 0;
      }
      .focus-panel .team-row { grid-template-columns: 1fr 90px; }
      .focus-panel .team-row > span:last-child { text-align: left; }
    }
    @media (max-width: 720px) {
      .shell { padding: 14px 12px 28px; }
      .topbar, .score-hero, .grid-3, .workflow, .risk-tabs, .control-bar, .model-grid, .segment-grid, .team-row { grid-template-columns: 1fr; }
      .dim-head, .loss-row { grid-template-columns: 1fr; }
      h1 { font-size: 21px; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <div class="mark">AI</div>
        <div>
          <h1>团队健康度 AI 诊断 MVP</h1>
          <p class="subtitle">MVP 只聚焦团队层面的“发现问题、识别风险”：健康度得分、失分归因、风险提示。暂不做行动计划推荐，避免工具越界成空泛运营建议。</p>
        </div>
      </div>
      <div class="badge-row">
        <span class="badge blue">对象：团队</span>
        <span class="badge gray">阶段：诊断与预警</span>
        <span class="badge gray">不做行动推荐</span>
      </div>
    </header>

    <section class="control-bar">
      <div>
        <label for="teamSelect">选择团队</label>
        <select id="teamSelect"></select>
      </div>
      <div>
        <label for="periodSelect">诊断周期</label>
        <select id="periodSelect">
          <option value="2026-06">2026-06 月度复盘</option>
          <option value="2026-Q2">2026 Q2 季度复盘</option>
        </select>
      </div>
    </section>

    <section class="decision-shell">
      <aside class="side-nav" aria-label="诊断流程导航">
        <h2>诊断流程</h2>
        <p>先识别重点团队，再进入单团队诊断，避免日常运营从明细开始找问题。</p>
        <button class="nav-item active" type="button" data-page="overview">
          <small>00</small><b>Overview 总览</b><span>先看经营全景、团队画像和排行，再筛选重点团队。</span>
        </button>
        <button class="nav-item" type="button" data-page="health">
          <small>01</small><b>健康度诊断</b><span>看选中团队的总分、标签、评分模型。</span>
        </button>
        <button class="nav-item" type="button" data-page="attribution">
          <small>02</small><b>归因分析</b><span>解释失分来自哪些维度，并给出核查问题。</span>
        </button>
        <button class="nav-item" type="button" data-page="risk">
          <small>03</small><b>风险提示</b><span>按风险类型查看触发逻辑和重点名单。</span>
        </button>
      </aside>
      <main id="app"></main>
    </section>
  </div>

  <script>
    const riskTypes = {
      churn: { label: "人员流失预警", short: "核心与中腰部成员活跃下滑", trigger: "连续两月活跃或贡献下滑，且近期行为减少" },
      newcomer: { label: "新人招募不足预警", short: "新增人数和新人启动质量不足", trigger: "新增经销商少，或新人30/90天启动率低" },
      action: { label: "行动不足预警", short: "工具、培训、活动等经营动作不足", trigger: "Prysm、App、活动、培训行为低于阈值" },
      target: { label: "临期目标达成不足预警", short: "周期末目标差距过大", trigger: "目标达成率低且剩余时间不足" },
      structure: { label: "团队结构风险", short: "过度依赖Top成员或中腰部塌陷", trigger: "Top3贡献占比过高，中腰部贡献不足" }
    };

    const teams = [
      {

        members: [
          ["李明", "核心成员", "流失风险", "近2月销售-31%，Prysm 21天未使用", "高"],
          ["王悦", "中腰部", "行动不足", "本月无活动参与，App登录低", "中"],
          ["张宁", "新人", "新人启动弱", "加入45天未形成复购顾客", "高"],

          ["刘静", "中腰部", "临期目标差距", "个人目标达成61%", "中"]

      },
      {

        activeMembers: 151, totalMembers: 176, activeDrop: 3, newRecruits: 16, recruitTarget: 15, newcomerActivation: 71,
        actionScore: 77, top3Share: 38, midShare: 39, customerScore: 74,
        members: [
          ["赵青", "核心成员", "健康", "稳定贡献，复购顾客增长", "低"],
          ["黄岚", "新人", "高潜", "30天内完成首单和顾客复测", "低"],
          ["吴越", "中腰部", "观察", "目标达成略低于团队均值", "中"]
        ]
      },
      {
        id: "T03", name: "华北长青团队", leader: "周宁", region: "华北", target: 920, sales: 645, daysLeft: 6,
        activeMembers: 104, totalMembers: 171, activeDrop: 16, newRecruits: 5, recruitTarget: 20, newcomerActivation: 28,
        actionScore: 41, top3Share: 61, midShare: 17, customerScore: 52,
        members: [
          ["林峰", "核心成员", "流失风险", "历史贡献高，近2月活跃顾客-34%", "高"],
          ["何然", "中腰部", "行动不足", "30天无培训和工具行为", "高"],
          ["王璐", "新人", "新人启动弱", "加入60天无首单", "高"],
          ["唐棠", "核心成员", "结构依赖", "Top3贡献集中，团队依赖增强", "高"],
          ["许默", "中腰部", "临期目标差距", "目标达成55%，剩余6天", "…3309 tokens truncated…群</h3>
              <p class="note">每个团队只进入一个主群组，用于确定日常运营管理入口。</p>
              <div class="segment-grid">
                ${segmentCard("高集中风险团队", rows.filter(r => r.segment === "高集中风险团队"))}
                ${segmentCard("新人断档团队", rows.filter(r => r.segment === "新人断档团队"))}
                ${segmentCard("活跃衰退团队", rows.filter(r => r.segment === "活跃衰退团队"))}
                ${segmentCard("健康增长型", rows.filter(r => r.segment === "健康增长型"))}
                ${segmentCard("稳定维持型", rows.filter(r => r.segment === "稳定维持型"))}
                ${segmentCard("重点观察团队", rows.filter(r => r.segment === "重点观察团队"))}
              </div>
            </div>
            <div class="profile-block">
              <h3>团队标签分布统计</h3>
              <p class="note">同一团队可命中多个标签，标签总数可能高于团队总数。</p>
              <div class="tag-list">${labelDistribution(tags, rows.length)}</div>
            </div>
          </div>
        </section>
        <section class="grid-2">
          <div class="panel">
            <h2>表现最佳 Top 10</h2>
            <p class="note">按团队健康度从高到低排序，用于识别可复盘和复制的团队。</p>
            <div class="rank-list">${top.map((r, i) => rankRow(r, i)).join("")}</div>
          </div>
          <div class="panel">
            <h2>表现最差 Bottom 10</h2>
            <p class="note">按团队健康度从低到高排序，用于识别需要优先诊断的团队。</p>
            <div class="rank-list">${bottom.map((r, i) => rankRow(r, i)).join("")}</div>
          </div>
        </section>
        <section class="panel focus-panel">
          <div class="panel-head">
            <div>
              <h2>重点关注团队</h2>
              <p class="note">完成总体判断后，从这里进入具体团队诊断。名单仅保留健康低分或命中红色风险标签的团队。</p>
            </div>
            <span class="badge red">AI 筛选 ${focus.length} / ${rows.length}</span>
          </div>
          <div class="ai-box yellow focus-summary">
            <b>AI 筛选结论</b>
            <p>当前最集中的团队标签为 ${leadingTags}。优先查看 ${topFocus.team.name}，它的健康度为 ${fmt(topFocus.score, 1)}，并触发 ${topFocus.labels.map(l => l[0]).join("、")}。点击名单进入健康度诊断，再继续查看失分归因和风险名单。</p>
          </div>
          <div class="team-list">${focus.map(r => teamRow(r)).join("")}</div>
        </section>
      `;
    }

    function healthHtml(t, dims, score, loss) {
      return `
        <section class="grid-2">
          <div class="panel">
            <div class="panel-head">
              <div>
                <h2>${t.name}</h2>
                <p class="note">Leader：${t.leader}｜区域：${t.region}｜团队对象诊断，不进入经销商个体行动建议。</p>
              </div>
              <span class="badge gray">规则诊断 V0.1</span>
            </div>
            <div class="score-hero">
              <div class="score-ring" style="--score:${score}">
                <div><strong>${fmt(score, 1)}</strong><span>健康度</span></div>
              </div>
              <div>
                <h3 class="label-title">团队标签</h3>
                <div class="badge-row">${labelFor(t).map(l => `<span class="badge ${l[1]}">${l[0]}</span>`).join("")}</div>
                <p class="note">标签由健康度失分、风险触发和团队结构共同生成，用于快速判断团队当前经营状态。</p>
                <div class="ai-box ${score < 62 ? "red" : score < 74 ? "yellow" : ""}">
                  <b>AI 初步诊断</b>
                  <p>${aiSummary(t, dims, loss)}</p>
                </div>
              </div>
            </div>
          </div>
          <div class="panel">
            <h2>健康度评分机制模型</h2>
            <p class="note">模型来自 PRD 的团队健康度指数：团队不是经销商个体简单加总，要同时看业绩、活跃、顾客资产、新人、结构和行动过程。</p>
            <div class="formula">团队健康度 = Σ（维度得分 × 维度权重），满分 100。MVP 使用规则模型，不做黑箱预测。</div>
            <div class="model-grid">${dims.map(d => modelCard(d)).join("")}</div>
          </div>
        </section>
        <section class="grid-3">
          ${kpi("目标达成", pct(t.sales / t.target * 100), `销售 ${fmt(t.sales)} / 目标 ${fmt(t.target)}`)}
          ${kpi("活跃率", pct(t.activeMembers / t.totalMembers * 100), `活跃 ${t.activeMembers} / 总人数 ${t.totalMembers}`)}
          ${kpi("Top3贡献占比", pct(t.top3Share), `结构风险阈值：50%`)}
        </section>
        <section class="panel">
          <h2>健康度得分计算</h2>
          <p class="note">把当前团队数据代入 6 个维度，展示每个维度对总分的贡献。</p>
          <div class="dimension-list">${dims.map(d => dimensionHtml(d)).join("")}</div>
        </section>
      `;
    }

    function attributionHtml(t, dims, loss) {
      const ordered = [...dims].sort((a, b) => a.score - b.score);
      return `
        <section class="grid-2">
          <div class="panel">
            <h2>${t.name}｜失分项目归因</h2>
            <p class="note">AI 按加权失分排序，告诉用户最该先看哪里。</p>
            <div class="loss-list">${loss.map(d => lossHtml(d)).join("")}</div>
            <div class="ai-box yellow" style="margin-top:12px">
              <b>主要失分结论</b>
              <p>${lossInsight(loss)}</p>
            </div>
          </div>
          <div class="panel">
            <h2>AI 引导式问题</h2>
            <p class="note">系统不要求用户自己找洞察，而是根据失分项主动提出核查问题。</p>
            <ul class="question-list">
              ${loss.slice(0, 4).map((d, i) => `<li><b>问题 ${i + 1}：${d.name}</b>${diagnosticQuestion(d.key, t)}</li>`).join("")}
            </ul>
          </div>
        </section>
        <section class="panel">
          <h2>归因证据</h2>
          <p class="note">这里不展示所有指标，只展示造成扣分的证据，帮助运营判断问题是否真实。</p>
          <div class="dimension-list">${ordered.map(d => dimensionHtml(d)).join("")}</div>
        </section>
      `;
    }

    function riskHtml(t, selectedRisk) {
      return `
        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>${t.name}｜风险提示与名单</h2>
              <p class="note">MVP只做风险发现和名单提示，不输出行动计划。新增“临期目标达成不足预警”，并纳入团队结构风险与团队标签。</p>
            </div>
            <span class="badge blue">${selectedRisk.label}</span>
          </div>
          <div class="risk-tabs">
            ${Object.entries(riskTypes).map(([key, r]) => `<button type="button" class="risk-tab ${state.risk === key ? "active" : ""}" data-risk="${key}"><b>${r.label}</b><span>${r.short}</span></button>`).join("")}
          </div>
          <div class="grid-2">
            <div>
              <div class="ai-box">
                <b>${selectedRisk.label}：触发逻辑</b>
                <p>${selectedRisk.trigger}</p>
              </div>
            </div>
            <div class="table-wrap">
              <table>
                <thead><tr><th>名单</th><th>角色</th><th>风险点</th><th>证据</th><th>等级</th></tr></thead>
                <tbody>${riskTableBody(t)}</tbody>
              </table>
            </div>
          </div>
        </section>
      `;
    }

    function render() {
      const t = team();
      const dims = dimensionScores(t);
      const score = health(t);
      const loss = dims.map(d => ({ ...d, loss: (100 - d.score) * d.weight })).sort((a, b) => b.loss - a.loss);
      const selectedRisk = riskTypes[state.risk];
      document.querySelectorAll("[data-page]").forEach(btn => btn.classList.toggle("active", btn.dataset.page === state.page));
      if (state.page === "overview") {
        document.getElementById("app").innerHTML = overviewHtml();
        bind();
        return;
      }
      if (state.page === "health") {
        document.getElementById("app").innerHTML = healthHtml(t, dims, score, loss);
        bind();
        return;
      }
      if (state.page === "attribution") {
        document.getElementById("app").innerHTML = attributionHtml(t, dims, loss);
        bind();
        return;
      }
      if (state.page === "risk") {
        document.getElementById("app").innerHTML = riskHtml(t, selectedRisk);
        bind();
        return;
      }
      document.getElementById("app").innerHTML = `
        <section class="grid-2">
          <div class="panel">
            <div class="panel-head">
              <div>
                <h2>${t.name}</h2>
                <p class="note">Leader：${t.leader}｜区域：${t.region}｜团队对象诊断，不进入经销商个体行动建议。</p>
              </div>
              <span class="badge gray">规则诊断 V0.1</span>
            </div>
            <div class="score-hero">
              <div class="score-ring" style="--score:${score}">
                <div><strong>${fmt(score, 1)}</strong><span>健康度</span></div>
              </div>
              <div>
                <h3 class="label-title">团队标签</h3>
                <div class="badge-row">${labelFor(t).map(l => `<span class="badge ${l[1]}">${l[0]}</span>`).join("")}</div>
                <p class="note">标签由健康度失分、风险触发和团队结构共同生成，用于快速判断团队当前经营状态。</p>
                <div class="ai-box ${score < 62 ? "red" : score < 74 ? "yellow" : ""}">
                  <b>AI 初步诊断</b>
                  <p>${aiSummary(t, dims, loss)}</p>
                </div>
              </div>
            </div>
          </div>
          <div class="panel">
            <h2>AI 引导式问题</h2>
            <p class="note">系统不要求用户自己找洞察，而是根据失分项主动提出核查问题。</p>
            <ul class="question-list">
              ${loss.slice(0, 3).map((d, i) => `<li><b>问题 ${i + 1}：${d.name}</b>${diagnosticQuestion(d.key, t)}</li>`).join("")}
            </ul>
          </div>
        </section>

        <section class="grid-3">
          ${kpi("目标达成", pct(t.sales / t.target * 100), `销售 ${fmt(t.sales)} / 目标 ${fmt(t.target)}`)}
          ${kpi("活跃率", pct(t.activeMembers / t.totalMembers * 100), `活跃 ${t.activeMembers} / 总人数 ${t.totalMembers}`)}
          ${kpi("Top3贡献占比", pct(t.top3Share), `结构风险阈值：50%`)}
        </section>

        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>0. 健康度评分机制模型</h2>
              <p class="note">模型来自 PRD 的团队健康度指数：团队不是经销商个体简单加总，要同时看业绩、活跃、顾客资产、新人、结构和行动过程。</p>
            </div>
            <span class="badge blue">规则模型 V0.1</span>
          </div>
          <div class="formula">团队健康度 = Σ（维度得分 × 维度权重），满分 100。MVP 使用规则模型，不做黑箱预测。</div>
          <div class="model-grid">
            ${dims.map(d => modelCard(d)).join("")}
          </div>
        </section>

        <section class="grid-2">
          <div class="panel">
            <h2>1. 健康度得分计算</h2>
            <p class="note">把当前团队数据代入 6 个维度，展示每个维度对总分的贡献。</p>
            <div class="dimension-list">
              ${dims.map(d => dimensionHtml(d)).join("")}
            </div>
          </div>
          <div class="panel">
            <h2>2. 失分项目归因</h2>
            <p class="note">AI 按加权失分排序，告诉用户最该先看哪里。</p>
            <div class="loss-list">
              ${loss.map(d => lossHtml(d)).join("")}
            </div>
            <div class="ai-box yellow" style="margin-top:12px">
              <b>主要失分结论</b>
              <p>${lossInsight(loss)}</p>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <div>
              <h2>3. 风险提示与名单</h2>
              <p class="note">MVP只做风险发现和名单提示，不输出行动计划。新增“临期目标达成不足预警”，并纳入团队结构风险与团队标签。</p>
            </div>
            <span class="badge blue">${selectedRisk.label}</span>
          </div>
          <div class="risk-tabs">
            ${Object.entries(riskTypes).map(([key, r]) => `<button type="button" class="risk-tab ${state.risk === key ? "active" : ""}" data-risk="${key}"><b>${r.label}</b><span>${r.short}</span></button>`).join("")}
          </div>
          <div class="grid-2">
            <div>
              <div class="ai-box">
                <b>${selectedRisk.label}：触发逻辑</b>
                <p>${selectedRisk.trigger}</p>
              </div>
            </div>
            <div class="table-wrap">
              <table>
                <thead><tr><th>名单</th><th>角色</th><th>风险点</th><th>证据</th><th>等级</th></tr></thead>
                <tbody>${riskTableBody(t)}</tbody>
              </table>
            </div>
          </div>
        </section>
      `;
      bind();
    }

    function kpi(label, value, sub) {
      return `<div class="kpi"><label>${label}</label><strong>${value}</strong><span>${sub}</span></div>`;
    }

    function rankRow(r, i) {
      const targetRate = r.team.sales / r.team.target * 100;
      return `<button type="button" class="rank-row" data-team="${r.team.id}">
        <span>#${i + 1}</span>
        <div><b>${r.team.name}</b><small>目标达成 ${pct(targetRate)}｜${r.segment}</small></div>
        <strong>${fmt(r.score, 1)}</strong>
      </button>`;
    }

    function labelDistribution(stats, total) {
      return stats.map(([label, count]) => {
        const width = clamp(count / total * 100, 6, 100);
        return `<div class="tag-row">
          <b>${label}</b>
          <div class="bar-track"><span class="${label.includes("风险") || label.includes("断档") || label.includes("依赖") ? "danger" : label.includes("不足") || label.includes("承压") ? "warn" : ""}" style="width:${width}%"></span></div>
          <strong>${count}</strong>
        </div>`;
      }).join("");
    }

    function teamRow(r) {
      return `<button type="button" class="team-row ${r.team.id === state.teamId ? "active" : ""}" data-team="${r.team.id}">
        <div>
          <b>${r.team.name}</b>
          <small>Leader：${r.team.leader}｜${r.team.region}｜${r.segment}</small>
        </div>
        <strong>${fmt(r.score, 1)}</strong>
        <div class="badge-row">${r.labels.map(l => `<span class="badge ${l[1]}">${l[0]}</span>`).join("")}</div>
        <span>点击进入诊断</span>
      </button>`;
    }

    function segmentCard(label, rows) {
      const names = rows.map(r => r.team.name).join("、") || "暂无团队";
      return `<div class="segment-card">
        <b>${label}</b>
        <strong>${rows.length}</strong>
        <span>${names}</span>
      </div>`;
    }

    function dimensionHtml(d) {
      const cls = d.score < 55 ? "danger" : d.score < 72 ? "warn" : "";
      return `<div class="dimension">
        <div class="dim-head"><b>${d.name}</b><div class="bar-track"><span class="${cls}" style="width:${clamp(d.score,0,100)}%"></span></div><strong>${fmt(d.score,1)} × ${fmt(d.weight * 100)}%</strong></div>
        <p>${d.evidence}</p>
      </div>`;
    }

    function modelCard(d) {
      const model = scoreModel.find(m => m[0] === d.key);
      return `<div class="model-card">
        <b>${d.name}</b>
        <strong>${fmt(d.weight * 100)}%</strong>
        <span>${model ? model[3] : d.evidence}</span>
      </div>`;
    }

    function lossHtml(d) {
      const width = clamp(d.loss * 4, 4, 100);
      return `<div class="loss-row"><b>${d.name}</b><div class="bar-track"><span class="${d.loss > 9 ? "danger" : d.loss > 6 ? "warn" : ""}" style="width:${width}%"></span></div><strong>-${fmt(d.loss,1)}分</strong></div>`;
    }

    function aiSummary(t, dims, loss) {
      const h = health(t);
      const main = loss[0];
      if (h < 62) return `该团队处于明显风险状态，健康度主要被“${main.name}”拉低。当前不是单纯销售问题，还叠加了${labelFor(t).map(x => x[0]).join("、")}等标签，需要先识别风险来源。`;
      if (h < 74) return `该团队处于观察区间，主要失分来自“${main.name}”。建议先聚焦该维度的证据和名单，判断是否形成趋势性风险。`;
      return `该团队整体健康，但仍需关注“${main.name}”的边际变化，避免结构风险被总分掩盖。`;
    }

    function diagnosticQuestion(key, t) {
      const map = {
        sales: `距离周期结束仅剩 ${t.daysLeft} 天，当前目标达成是否足以支撑月末目标？差距主要来自核心成员还是中腰部？`,
        active: `活跃成员下降 ${pct(t.activeDrop)}，是核心成员流失，还是中腰部沉睡扩大？`,
        customer: `顾客资产综合分 ${fmt(t.customerScore)}，弱项更可能来自活跃顾客、复购顾客、订阅顾客，还是顾客流失？`,
        newcomer: `新增 ${t.newRecruits}/${t.recruitTarget}，新人启动率 ${pct(t.newcomerActivation)}，是否已经出现新人断档？`,
        action: `行动活跃分 ${fmt(t.actionScore)}，工具、培训、活动里哪一个环节最弱？`,
        structure: `Top3贡献 ${pct(t.top3Share)}，中腰部贡献 ${pct(t.midShare)}，团队是否正在变成少数人支撑？`
      };
      return map[key];
    }

    function lossInsight(loss) {
      const top = loss.slice(0, 2).map(d => d.name).join("、");
      return `当前最主要失分来自 ${top}。这意味着用户不需要先翻全部指标，而应先围绕这两个维度核查证据和风险名单。`;
    }

    function bind() {
      document.querySelectorAll("[data-page]").forEach(btn => {
        btn.onclick = () => {
          state.page = btn.dataset.page;
          if (state.page === "overview") {
            state.teamId = "all";
          } else if (state.teamId === "all") {
            state.teamId = portfolio()[0].team.id;
          }
          document.getElementById("teamSelect").value = state.teamId;
          render();
        };
      });
      document.querySelectorAll("[data-team]").forEach(btn => {
        btn.onclick = () => {
          state.teamId = btn.dataset.team;
          state.page = "health";
          document.getElementById("teamSelect").value = state.teamId;
          render();
        };
      });
      document.querySelectorAll("[data-risk]").forEach(btn => btn.addEventListener("click", () => {
        state.risk = btn.dataset.risk;
        render();
      }));
    }

    function setup() {
      document.getElementById("teamSelect").innerHTML = `<option value="all">全体团队 Overview</option>` + teams.map(t => `<option value="${t.id}">${t.name}｜${t.leader}</option>`).join("");
      document.getElementById("teamSelect").value = state.teamId;
      document.getElementById("teamSelect").addEventListener("change", e => {
        state.teamId = e.target.value;
        state.page = state.teamId === "all" ? "overview" : "health";
        render();
      });
      render();
    }

    setup();
  </script>
</body>
</html>
